components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        password_hash:
          type: string
        email_verified:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - password_hash
      - email_verified
      - created_at
    folders:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - created_at
    notes:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        folder_id:
          type: string
          format: uuid
        title:
          type: string
        content:
          type: string
        content_text:
          type: string
        search_vector:
          type: string
        version:
          type: integer
        is_trashed:
          type: boolean
        trashed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - title
      - content
      - content_text
      - version
      - is_trashed
      - created_at
      - updated_at
    password_reset_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - expires_at
